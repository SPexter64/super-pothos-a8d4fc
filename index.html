<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRC Portal | Sign In</title>
    <link rel="stylesheet" href="login-style.css" />
  </head>
  <body>
    <div class="login-wrapper">
      <div class="visual-side">
        <div class="content-overlay">
          <div class="school-tag">Global Reciprocal College</div>
          <h1>Welcome at<br /><span>GRC PORTAL</span></h1>
          <p>
            Access your student portal to manage your profile, track your tuition fee, view prospectus,
            and view your schedule.
          </p>
        </div>
      </div>

      <div class="form-side">
        <div class="login-container">
          <div class="form-header">
            <h2>Sign In</h2>
            <p>Welcome! Please enter your details below.</p>
          </div>

          <form class="main-form" onsubmit="handleLogin(event)">
            <div class="field">
              <label>Student Name</label>
              <input type="text" id="fullName" placeholder="Enter your full name" required />
            </div>

            <div class="field">
              <label>Student Number</label>
              <input
                type="text"
                id="studentNo"
                placeholder="2024-10-00209"
                pattern="^\d{4}-\d{2}-\d{5}$"
                title="Format: 2024-10-00209"
                oninput="this.value = this.value.replace(/[^0-9-]/g, '')"
                required
              />
            </div>

            <button type="submit" class="submit-btn">Sign In</button>
            <div class="form-footer">
              <a href="#">Forgot Password?</a> <span>•</span> <a href="#">Need Help?</a>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      function handleLogin(event) {
        event.preventDefault();
        const fullName = document.getElementById("fullName").value;
        const studentNo = document.getElementById("studentNo").value;
        const pattern = /^\d{4}-\d{2}-\d{5}$/;

        if (!pattern.test(studentNo)) {
          alert("Invalid Student Number format.\nUse: 2024-10-00209");
          return;
        }

        localStorage.setItem("userFullName", fullName);
        localStorage.setItem("studentNumber", studentNo);
        window.location.href = "mainpage.html";
      }
    </script>
  </body>
</html>
